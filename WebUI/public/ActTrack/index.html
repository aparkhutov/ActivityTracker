<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трекер Активностей</title>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/timeline.css">
    <link rel="stylesheet" href="css/tables.css">
</head>
<body>
    <div class="tracker-container">
        <!-- Заголовок и управление датой -->
        <header class="tracker-header">
            <h1>Мониторинг активности</h1>
            <div class="date-selector">
                <button id="prev-day">&larr;</button>
                <span id="current-date">2026-09-08</span>
                <button id="next-day">&rarr;</button>
            </div>
        </header>

        <!-- Таймлайн с полосами -->
        <div class="timeline-container">
            <div class="time-scale" id="time-scale"></div>

            <div class="timeline-rows">
                <div class="timeline-row" data-row-type="tags" id="row-container-tags">
                    <div class="row-label">Теги</div>
                    <div class="row-timeline" id="row-tags"></div>
                </div>
                <div class="timeline-row" data-row-type="activity" id="row-container-activity">
                    <div class="row-label">Активность</div>
                    <div class="row-timeline" id="row-activity"></div>
                </div>
                <div class="timeline-row" data-row-type="apps" id="row-container-apps">
                    <div class="row-label">Приложения</div>
                    <div class="row-timeline" id="row-apps"></div>
                </div>
                <div class="timeline-row" data-row-type="docs" id="row-container-docs">
                    <div class="row-label">Документ</div>
                    <div class="row-timeline" id="row-docs"></div>
                </div>
            </div>
        </div>

        <!-- Две колонки снизу -->
        <div class="bottom-dashboard">
            <!-- Левая колонка: Хронология блоков с шапкой и сортировкой -->
            <div class="dashboard-col">
                <div class="col-content no-header">
                    <table class="blocks-table">
                        <thead>
                            <tr>
                                <th style="width: 40px;"><input type="checkbox" id="th-select-all"></th>
                                <th style="width: 40px;">Тип</th>
                                <th class="sortable" data-sort="name">Название <span class="sort-icon"></span></th>
                                <th class="sortable" data-sort="start">Старт <span class="sort-icon"></span></th>
                                <th class="sortable" data-sort="end">Конец <span class="sort-icon"></span></th>
                                <th class="sortable" data-sort="duration">Длительность <span class="sort-icon"></span></th>
                            </tr>
                        </thead>
                        <tbody id="blocks-table-body">
                            <!-- Заполняется из JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Правая колонка: Общая статистика на фоне с выбранным временем -->
            <div class="dashboard-col">
                <div class="col-content no-header border-top-fix">
                    <table class="dashboard-table">
                        <tbody id="stats-table-body">
                            <!-- Заполняется из JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Подключение по старинке (CORS-friendly для локальных файлов) -->
    <script src="data.js"></script>
    <script src="utils.js"></script>
    <script src="dashboard.js"></script>
    <script src="script.js"></script>
</body>
</html>
